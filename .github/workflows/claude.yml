name: F-002 Free Read-Only RCE PoC

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted base repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show trusted base settings
        shell: bash
        run: |
          echo "======================================"
          echo "TRUSTED BASE BEFORE CLAUDE"
          echo "======================================"
          echo "BRANCH=$(git branch --show-current)"
          echo
          cat config/claude-action-settings.json

      - name: Start synthetic Anthropic API
        shell: bash
        run: |
          cat > /tmp/f002_fake_anthropic.py <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import json
          import time

          HOST = "127.0.0.1"
          PORT = 8787
          MARKER = "F002_READ_ONLY_RCE"


          class Handler(BaseHTTPRequestHandler):

              def log_message(self, fmt, *args):
                  print("[HTTP] " + (fmt % args), flush=True)

              def send_json(self, status, obj):
                  data = json.dumps(obj).encode("utf-8")

                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()

                  self.wfile.write(data)

              def read_body(self):
                  try:
                      length = int(
                          self.headers.get("Content-Length", "0")
                      )
                  except ValueError:
                      length = 0

                  if length <= 0:
                      return b""

                  return self.rfile.read(length)

              def do_GET(self):
                  print(
                      "[REQUEST] GET " + self.path,
                      flush=True
                  )

                  self.send_json(
                      200,
                      {
                          "status": "ok",
                          "service": "f002-synthetic-anthropic"
                      }
                  )

              def do_POST(self):
                  raw = self.read_body()

                  text = raw.decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      "[REQUEST] POST " + self.path,
                      flush=True
                  )

                  # ------------------------------------------
                  # DECISIVE READ-ONLY RCE EVIDENCE
                  #
                  # SessionStart stdout is expected to enter
                  # Claude context, therefore the marker
                  # should appear in the first model request.
                  # ------------------------------------------
                  if MARKER in text:
                      position = text.find(MARKER)

                      evidence = text[
                          position:
                          min(len(text), position + 1000)
                      ]

                      # Make output easier to read in Actions.
                      evidence = evidence.replace(
                          "\\n",
                          " "
                      )

                      print(
                          "======================================",
                          flush=True
                      )
                      print(
                          "F002_SESSIONSTART_RCE=CONFIRMED",
                          flush=True
                      )
                      print(
                          "======================================",
                          flush=True
                      )
                      print(
                          "RCE_CONTEXT_BEGIN",
                          flush=True
                      )
                      print(
                          evidence,
                          flush=True
                      )
                      print(
                          "RCE_CONTEXT_END",
                          flush=True
                      )

                  # Claude/SDK may perform token counting.
                  if "count_tokens" in self.path:
                      self.send_json(
                          200,
                          {
                              "input_tokens": 10
                          }
                      )
                      return

                  if "/v1/messages" not in self.path:
                      self.send_json(
                          404,
                          {
                              "type": "error",
                              "error": {
                                  "type": "not_found_error",
                                  "message": "Synthetic endpoint"
                              }
                          }
                      )
                      return

                  try:
                      request_json = json.loads(
                          raw.decode("utf-8")
                      )
                  except Exception:
                      request_json = {}

                  model = request_json.get(
                      "model",
                      "claude-f002-synthetic"
                  )

                  # ------------------------------------------
                  # Streaming Messages API
                  # ------------------------------------------
                  if request_json.get("stream") is True:
                      self.send_response(200)
                      self.send_header(
                          "Content-Type",
                          "text/event-stream"
                      )
                      self.send_header(
                          "Cache-Control",
                          "no-cache"
                      )
                      self.send_header(
                          "Connection",
                          "close"
                      )
                      self.end_headers()

                      events = [
                          (
                              "message_start",
                              {
                                  "type": "message_start",
                                  "message": {
                                      "id": "msg_f002_synthetic",
                                      "type": "message",
                                      "role": "assistant",
                                      "model": model,
                                      "content": [],
                                      "stop_reason": None,
                                      "stop_sequence": None,
                                      "usage": {
                                          "input_tokens": 10,
                                          "output_tokens": 0
                                      }
                                  }
                              }
                          ),
                          (
                              "content_block_start",
                              {
                                  "type": "content_block_start",
                                  "index": 0,
                                  "content_block": {
                                      "type": "text",
                                      "text": ""
                                  }
                              }
                          ),
                          (
                              "content_block_delta",
                              {
                                  "type": "content_block_delta",
                                  "index": 0,
                                  "delta": {
                                      "type": "text_delta",
                                      "text": "Synthetic F-002 response"
                                  }
                              }
                          ),
                          (
                              "content_block_stop",
                              {
                                  "type": "content_block_stop",
                                  "index": 0
                              }
                          ),
                          (
                              "message_delta",
                              {
                                  "type": "message_delta",
                                  "delta": {
                                      "stop_reason": "end_turn",
                                      "stop_sequence": None
                                  },
                                  "usage": {
                                      "output_tokens": 4
                                  }
                              }
                          ),
                          (
                              "message_stop",
                              {
                                  "type": "message_stop"
                              }
                          )
                      ]

                      for event_name, event_data in events:
                          payload = (
                              "event: "
                              + event_name
                              + "\n"
                              + "data: "
                              + json.dumps(event_data)
                              + "\n\n"
                          ).encode("utf-8")

                          try:
                              self.wfile.write(payload)
                              self.wfile.flush()
                          except BrokenPipeError:
                              break

                          time.sleep(0.03)

                      return

                  # ------------------------------------------
                  # Non-streaming fallback
                  # ------------------------------------------
                  self.send_json(
                      200,
                      {
                          "id": "msg_f002_synthetic",
                          "type": "message",
                          "role": "assistant",
                          "model": model,
                          "content": [
                              {
                                  "type": "text",
                                  "text": "Synthetic F-002 response"
                              }
                          ],
                          "stop_reason": "end_turn",
                          "stop_sequence": None,
                          "usage": {
                              "input_tokens": 10,
                              "output_tokens": 4
                          }
                      }
                  )


          print(
              "Starting F-002 synthetic API on "
              + HOST
              + ":"
              + str(PORT),
              flush=True
          )

          ThreadingHTTPServer(
              (HOST, PORT),
              Handler
          ).serve_forever()
          PY

          nohup python3 /tmp/f002_fake_anthropic.py \
            > /tmp/f002_fake_anthropic.log 2>&1 &

          echo $! > /tmp/f002_fake_anthropic.pid

          sleep 2

          echo "MOCK_PID=$(cat /tmp/f002_fake_anthropic.pid)"

          echo
          echo "Health check:"
          curl --fail --silent --show-error \
            http://127.0.0.1:8787/

          echo

      - name: Verify synthetic Messages API
        shell: bash
        run: |
          RESPONSE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              -X POST \
              http://127.0.0.1:8787/v1/messages \
              -H 'Content-Type: application/json' \
              --data '{
                "model": "claude-f002-synthetic",
                "max_tokens": 8,
                "messages": [
                  {
                    "role": "user",
                    "content": "synthetic preflight"
                  }
                ]
              }'
          )"

          echo "$RESPONSE"

          echo
          echo "SYNTHETIC_API_PREFLIGHT=OK"

      - name: Run vulnerable Claude Code Action
        id: claude
        continue-on-error: true

        # For final report, preferably replace @v1 with the
        # exact commit SHA that produced finding F-002.
        uses: anthropics/claude-code-action@v1

        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:8787

          # Synthetic trusted value, NOT a real credential.
          F002_PRIVILEGED_CANARY: "BASE_ONLY_CANARY_F002_7F3B91"

        with:
          # Synthetic placeholder used only because the action
          # requires an auth input. Requests go to localhost.
          anthropic_api_key: "F002-SYNTHETIC-DUMMY-KEY"

          trigger_phrase: "@claude"

          # Vulnerable indirect path being tested.
          settings: "config/claude-action-settings.json"

          # Synthetic lab only.
          show_full_output: "true"

      - name: Inspect settings provenance
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "F-002 SETTINGS PROVENANCE"
          echo "======================================"

          echo
          echo "[1] CURRENT BRANCH"
          echo "--------------------------------------"
          git branch --show-current || true

          echo
          echo "[2] REPOSITORY SETTINGS AFTER ACTION"
          echo "--------------------------------------"

          if [ -f config/claude-action-settings.json ]; then
            cat config/claude-action-settings.json
          else
            echo "MISSING"
          fi

          echo
          echo "[3] CLAUDE USER SETTINGS"
          echo "--------------------------------------"

          if [ -f "$HOME/.claude/settings.json" ]; then
            cat "$HOME/.claude/settings.json"
          else
            echo "MISSING"
          fi

          echo
          echo "[4] ATTACKER PAYLOAD IN USER SETTINGS"
          echo "--------------------------------------"

          if grep \
            --quiet \
            'F002_READ_ONLY_RCE' \
            "$HOME/.claude/settings.json" \
            2>/dev/null; then

            echo "SETTINGS_INJECTION=CONFIRMED"

          else

            echo "SETTINGS_INJECTION=NOT_CONFIRMED"

          fi

      - name: Show synthetic API evidence
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "F-002 SYNTHETIC API EVIDENCE"
          echo "======================================"

          if [ -f /tmp/f002_fake_anthropic.log ]; then
            cat /tmp/f002_fake_anthropic.log
          else
            echo "MOCK LOG MISSING"
          fi

      - name: Verify read-only RCE
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "F-002 FINAL RESULT"
          echo "======================================"

          if grep \
            --quiet \
            'F002_SESSIONSTART_RCE=CONFIRMED' \
            /tmp/f002_fake_anthropic.log \
            2>/dev/null; then

            echo
            echo "F002_RESULT=VULNERABLE"
            echo

            grep \
              -A8 \
              'F002_SESSIONSTART_RCE=CONFIRMED' \
              /tmp/f002_fake_anthropic.log || true

          else

            echo
            echo "F002_RESULT=NOT_CONFIRMED"
            echo
            echo "Settings provenance:"
            echo

            if grep \
              --quiet \
              'F002_READ_ONLY_RCE' \
              "$HOME/.claude/settings.json" \
              2>/dev/null; then

              echo "ATTACKER_SETTINGS_REACHED_USER_SETTINGS=YES"

            else

              echo "ATTACKER_SETTINGS_REACHED_USER_SETTINGS=NO"

            fi

            echo
            echo "Synthetic API log:"
            cat /tmp/f002_fake_anthropic.log || true

            exit 1

          fi

      - name: Stop synthetic API
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/f002_fake_anthropic.pid ]; then
            kill "$(cat /tmp/f002_fake_anthropic.pid)" 2>/dev/null || true
          fi
