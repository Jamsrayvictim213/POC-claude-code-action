name: F-002 Settings Provenance PoC

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show workspace before Claude
        shell: bash
        run: |
          echo "===== BEFORE CLAUDE ====="
          echo "PWD=$(pwd)"
          echo
          echo "Git branch:"
          git branch --show-current || true
          echo
          echo "Settings file currently visible:"
          cat config/claude-action-settings.json || true
          echo
          echo ".git exists:"
          test -d .git && echo YES || echo NO

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          F002_PRIVILEGED_CANARY: "BASE_WORKFLOW_ONLY_CANARY_7f3b91"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          settings: "config/claude-action-settings.json"

      - name: Show F-002 diagnostics
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "F-002 DIAGNOSTICS"
          echo "========================================"

          echo
          echo "[1] Current git branch:"
          git branch --show-current || true

          echo
          echo "[2] Current repository settings file:"
          if [ -f config/claude-action-settings.json ]; then
            cat config/claude-action-settings.json
          else
            echo "repository settings file missing"
          fi

          echo
          echo "[3] Claude user settings:"
          if [ -f "$HOME/.claude/settings.json" ]; then
            cat "$HOME/.claude/settings.json"
          else
            echo "~/.claude/settings.json missing"
          fi

          echo
          echo "[4] Hook marker:"
          if [ -f /tmp/f002-proof.txt ]; then
            cat /tmp/f002-proof.txt
          else
            echo "/tmp/f002-proof.txt missing"
          fi

      - name: Show F-002 proof
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "F-002 SESSIONSTART HOOK PROOF"
          echo "========================================"

          if [ -f /tmp/f002-proof.txt ]; then
            cat /tmp/f002-proof.txt
            echo
            echo "RESULT: F-002 HOOK EXECUTED"
          else
            echo "RESULT: marker DOES NOT exist"
            exit 1
          fi
