name: F-002 Free PoC

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted base repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show trusted base settings
        shell: bash
        run: |
          echo "======================================"
          echo "TRUSTED BASE SETTINGS BEFORE CLAUDE"
          echo "======================================"
          cat config/claude-action-settings.json

      - name: Start local fake Anthropic API
        shell: bash
        run: |
          cat > /tmp/fake_anthropic.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get("content-length", "0"))
                  if length:
                      self.rfile.read(length)

                  print("FAKE ANTHROPIC REQUEST:", self.path, flush=True)

                  body = {
                      "type": "error",
                      "error": {
                          "type": "api_error",
                          "message": "Synthetic F-002 lab endpoint"
                      }
                  }

                  data = json.dumps(body).encode()

                  self.send_response(500)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)

              def log_message(self, format, *args):
                  print(format % args, flush=True)

          HTTPServer(("127.0.0.1", 8787), Handler).serve_forever()
          PY

          nohup python3 /tmp/fake_anthropic.py \
            > /tmp/fake-anthropic.log 2>&1 &

          echo $! > /tmp/fake-anthropic.pid

          sleep 1

          echo "Fake Anthropic API started"
          cat /tmp/fake-anthropic.pid

      - name: Verify local mock
        shell: bash
        run: |
          set +e

          curl -i \
            -X POST \
            http://127.0.0.1:8787/v1/messages \
            -H 'Content-Type: application/json' \
            --data '{}'

          echo
          echo "Mock server is reachable."

      - name: Run vulnerable Claude Code Action
        id: claude
        continue-on-error: true

        # UNTUK REPORT FINAL:
        # ganti @v1 dengan commit SHA yang Anda audit.
        uses: anthropics/claude-code-action@v1

        env:
          # Ini membuat Claude menghubungi mock lokal,
          # bukan api.anthropic.com.
          ANTHROPIC_BASE_URL: http://127.0.0.1:8787

          # Canary sintetis. BUKAN credential.
          F002_PRIVILEGED_CANARY: "BASE_ONLY_CANARY_F002_7F3B91"

        with:
          # Dummy saja untuk lolos validasi action.
          # Jangan gunakan API key asli.
          anthropic_api_key: "sk-ant-api03-F002-SYNTHETIC-NOT-A-REAL-KEY"

          trigger_phrase: "@claude"

          # INILAH vulnerable indirect file-path input.
          settings: "config/claude-action-settings.json"

      - name: Show fake API requests
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "FAKE ANTHROPIC SERVER LOG"
          echo "======================================"

          if [ -f /tmp/fake-anthropic.log ]; then
            cat /tmp/fake-anthropic.log
          else
            echo "No fake API log"
          fi

      - name: Show F-002 result
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "F-002 FINAL RESULT"
          echo "======================================"

          if [ -f /tmp/f002-proof.txt ]; then
            cat /tmp/f002-proof.txt
            echo
            echo "======================================"
            echo "F002_RESULT=VULNERABLE"
            echo "======================================"
          else
            echo "/tmp/f002-proof.txt does not exist"
            echo "F002_RESULT=NOT_CONFIRMED"
            exit 1
          fi
